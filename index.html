<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Minesweeper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .stat-label {
            font-weight: bold;
            color: #4ecca3;
        }
        
        .stat-value {
            color: #fff;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        #new-game-btn {
            background: #4ecca3;
            color: #1a1a2e;
        }
        
        #new-game-btn:hover {
            background: #45b08c;
            transform: translateY(-2px);
        }
        
        #difficulty-select {
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background: #4ecca3;
            color: #1a1a2e;
            cursor: pointer;
        }
        
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            z-index: 200;
            display: none;
            text-align: center;
        }
        
        #instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 250px;
            backdrop-filter: blur(10px);
        }
        
        #instructions h3 {
            margin-bottom: 10px;
            color: #4ecca3;
        }
        
        #instructions ul {
            list-style: none;
            padding-left: 0;
        }
        
        #instructions li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="ui-overlay">
        <h1>🎯 3D Minesweeper</h1>
        <div class="stat-row">
            <span class="stat-label">Mines:</span>
            <span class="stat-value" id="mine-count">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Flags:</span>
            <span class="stat-value" id="flag-count">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Time:</span>
            <span class="stat-value" id="timer">00:00</span>
        </div>
    </div>
    
    <div id="instructions">
        <h3>How to Play</h3>
        <ul>
            <li>🖱️ Left-click: Reveal cell</li>
            <li>🖱️ Right-click: Place flag</li>
            <li>🎯 Find all mines without exploding!</li>
            <li>📐 Drag to rotate view</li>
            <li>🔍 Scroll to zoom</li>
        </ul>
    </div>
    
    <div id="controls">
        <select id="difficulty-select">
            <option value="easy">Easy (8x8, 10 mines)</option>
            <option value="medium" selected>Medium (12x12, 20 mines)</option>
            <option value="hard">Hard (16x16, 40 mines)</option>
        </select>
        <button id="new-game-btn">New Game</button>
    </div>
    
    <div id="message"></div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Game state
        let scene, camera, renderer, controls;
        let cells = [];
        let boardSize = 12;
        let mineCount = 20;
        let flagsPlaced = 0;
        let gameOver = false;
        let gameStarted = false;
        let startTime;
        let timerInterval;
        let cellObjects = [];
        let raycaster, mouse;
        
        // Colors
        const COLORS = {
            cell: 0xd4a574,
            cellHover: 0xe8c49e,
            revealed: 0xf5deb3,
            mine: 0x2c3e50,
            flag: 0xe74c3c,
            exploded: 0xc0392b,
            board: 0x8b4513,
            boardLight: 0xcd853f
        };
        
        // Number colors
        const NUMBER_COLORS = [
            0xffffff, // 0
            0x3498db, // 1
            0x2ecc71, // 2
            0xe74c3c, // 3
            0x9b59b6, // 4
            0xf39c12, // 5
            0x1abc9c, // 6
            0x34495e, // 7
            0x7f8c8d  // 8
        ];
        
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            
            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 25, 20);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);
            
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 10;
            controls.maxDistance = 50;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // Event listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onMouseClick);
            renderer.domElement.addEventListener('contextmenu', onRightClick);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            
            document.getElementById('new-game-btn').addEventListener('click', startNewGame);
            document.getElementById('difficulty-select').addEventListener('change', onDifficultyChange);
            
            // Start game
            startNewGame();
            
            // Animation loop
            animate();
        }
        
        function createBoard() {
            // Clear existing cells
            cellObjects.forEach(obj => scene.remove(obj));
            cellObjects = [];
            cells = [];
            
            const cellSize = 1.5;
            const gap = 0.05;
            const totalSize = boardSize * (cellSize + gap);
            const offset = totalSize / 2;
            
            // Create board base
            const boardGeometry = new THREE.BoxGeometry(totalSize + 1, 0.3, totalSize + 1);
            const boardMaterial = new THREE.MeshStandardMaterial({ 
                color: COLORS.board,
                roughness: 0.8
            });
            const board = new THREE.Mesh(boardGeometry, boardMaterial);
            board.position.y = -0.4;
            board.receiveShadow = true;
            scene.add(board);
            
            // Create checkerboard pattern
            for (let x = 0; x < boardSize; x++) {
                cells[x] = [];
                for (let z = 0; z < boardSize; z++) {
                    const isLight = (x + z) % 2 === 0;
                    const geometry = new THREE.BoxGeometry(cellSize, 0.5, cellSize);
                    const material = new THREE.MeshStandardMaterial({ 
                        color: isLight ? COLORS.boardLight : COLORS.board,
                        roughness: 0.7
                    });
                    const cell = new THREE.Mesh(geometry, material);
                    cell.position.set(
                        x * (cellSize + gap) - offset + cellSize / 2,
                        0,
                        z * (cellSize + gap) - offset + cellSize / 2
                    );
                    cell.castShadow = true;
                    cell.receiveShadow = true;
                    cell.userData = { 
                        x, z, 
                        isMine: false, 
                        revealed: false, 
                        flagged: false, 
                        neighborCount: 0,
                        isLight
                    };
                    scene.add(cell);
                    cellObjects.push(cell);
                    cells[x][z] = cell;
                }
            }
        }
        
        function placeMines(excludeX, excludeZ) {
            let minesPlaced = 0;
            while (minesPlaced < mineCount) {
                const x = Math.floor(Math.random() * boardSize);
                const z = Math.floor(Math.random() * boardSize);
                
                // Don't place mine on first click or adjacent cells
                const dx = Math.abs(x - excludeX);
                const dz = Math.abs(z - excludeZ);
                if (dx <= 1 && dz <= 1) continue;
                
                if (!cells[x][z].userData.isMine) {
                    cells[x][z].userData.isMine = true;
                    minesPlaced++;
                }
            }
        }
        
        function calculateNeighbors() {
            for (let x = 0; x < boardSize; x++) {
                for (let z = 0; z < boardSize; z++) {
                    if (cells[x][z].userData.isMine) continue;
                    
                    let count = 0;
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dz = -1; dz <= 1; dz++) {
                            const nx = x + dx;
                            const nz = z + dz;
                            if (nx >= 0 && nx < boardSize && nz >= 0 && nz < boardSize) {
                                if (cells[nx][nz].userData.isMine) count++;
                            }
                        }
                    }
                    cells[x][z].userData.neighborCount = count;
                }
            }
        }
        
        function revealCell(x, z) {
            if (x < 0 || x >= boardSize || z < 0 || z >= boardSize) return;
            const cell = cells[x][z];
            const data = cell.userData;
            
            if (data.revealed || data.flagged) return;
            
            data.revealed = true;
            
            // Change appearance
            const geometry = new THREE.BoxGeometry(1.4, 0.3, 1.4);
            const material = new THREE.MeshStandardMaterial({ 
                color: COLORS.revealed,
                roughness: 0.9
            });
            cell.geometry.dispose();
            cell.material.dispose();
            cell.geometry = geometry;
            cell.material = material;
            cell.position.y = -0.1;
            
            if (data.isMine) {
                // Game over - mine hit
                data.exploded = true;
                cell.material.color.setHex(COLORS.exploded);
                endGame(false);
                return;
            }
            
            // Show number if > 0
            if (data.neighborCount > 0) {
                createNumberText(cell, data.neighborCount);
            } else {
                // Reveal neighbors recursively
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dz = -1; dz <= 1; dz++) {
                        revealCell(x + dx, z + dz);
                    }
                }
            }
            
            checkWin();
        }
        
        function createNumberText(cell, number) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 128;
            
            ctx.fillStyle = '#f5deb3';
            ctx.fillRect(0, 0, 128, 128);
            
            ctx.fillStyle = '#' + NUMBER_COLORS[number].toString(16).padStart(6, '0');
            ctx.font = 'bold 80px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(number.toString(), 64, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.copy(cell.position);
            sprite.position.y = 0.3;
            sprite.scale.set(0.8, 0.8, 1);
            scene.add(sprite);
            cell.userData.numberSprite = sprite;
        }
        
        function toggleFlag(cell) {
            const data = cell.userData;
            if (data.revealed) return;
            
            data.flagged = !data.flagged;
            
            if (data.flagged) {
                flagsPlaced++;
                // Add flag marker
                const flagGeometry = new THREE.ConeGeometry(0.2, 0.6, 8);
                const flagMaterial = new THREE.MeshStandardMaterial({ color: COLORS.flag });
                const flag = new THREE.Mesh(flagGeometry, flagMaterial);
                flag.position.copy(cell.position);
                flag.position.y = 0.5;
                scene.add(flag);
                cell.userData.flag = flag;
            } else {
                flagsPlaced--;
                if (cell.userData.flag) {
                    scene.remove(cell.userData.flag);
                    cell.userData.flag = null;
                }
            }
            
            updateUI();
        }
        
        function checkWin() {
            let revealedCount = 0;
            for (let x = 0; x < boardSize; x++) {
                for (let z = 0; z < boardSize; z++) {
                    if (cells[x][z].userData.revealed) revealedCount++;
                }
            }
            
            const totalCells = boardSize * boardSize;
            const safeCells = totalCells - mineCount;
            
            if (revealedCount === safeCells) {
                endGame(true);
            }
        }
        
        function endGame(won) {
            gameOver = true;
            gameStarted = false;
            clearInterval(timerInterval);
            
            const messageEl = document.getElementById('message');
            if (won) {
                messageEl.textContent = '🎉 YOU WIN! 🎉';
                messageEl.style.color = '#4ecca3';
            } else {
                messageEl.textContent = '💥 GAME OVER 💥';
                messageEl.style.color = '#e74c3c';
                // Reveal all mines
                cellObjects.forEach(cell => {
                    if (cell.userData.isMine && !cell.userData.flagged) {
                        const geometry = new THREE.BoxGeometry(1.4, 0.3, 1.4);
                        const material = new THREE.MeshStandardMaterial({ color: COLORS.mine });
                        cell.geometry.dispose();
                        cell.material.dispose();
                        cell.geometry = geometry;
                        cell.material = material;
                        cell.position.y = -0.1;
                        
                        if (cell.userData.numberSprite) {
                            scene.remove(cell.userData.numberSprite);
                        }
                    }
                });
            }
            messageEl.style.display = 'block';
        }
        
        function startNewGame() {
            // Reset state
            gameOver = false;
            gameStarted = false;
            flagsPlaced = 0;
            clearInterval(timerInterval);
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('message').style.display = 'none';
            
            // Get difficulty
            const difficulty = document.getElementById('difficulty-select').value;
            switch(difficulty) {
                case 'easy':
                    boardSize = 8;
                    mineCount = 10;
                    break;
                case 'medium':
                    boardSize = 12;
                    mineCount = 20;
                    break;
                case 'hard':
                    boardSize = 16;
                    mineCount = 40;
                    break;
            }
            
            // Clear scene - remove all game objects
            // First, remove all flags from cell userData
            cellObjects.forEach(cell => {
                if (cell.userData.flag) {
                    scene.remove(cell.userData.flag);
                    cell.userData.flag = null;
                }
                if (cell.userData.numberSprite) {
                    scene.remove(cell.userData.numberSprite);
                    cell.userData.numberSprite = null;
                }
            });
            
            // Remove all cell objects
            cellObjects.forEach(obj => scene.remove(obj));
            cellObjects = [];
            
            // Remove any remaining sprites (number displays)
            const sprites = scene.children.filter(c => c.type === 'Sprite');
            sprites.forEach(s => scene.remove(s));
            
            // Remove any remaining flags (cone geometries)
            const flags = scene.children.filter(c => c.geometry && c.geometry.type === 'ConeGeometry');
            flags.forEach(f => scene.remove(f));
            
            // Remove board bases
            const boards = scene.children.filter(c => c.geometry && c.geometry.type === 'BoxGeometry' && c.position.y === -0.4);
            boards.forEach(b => scene.remove(b));
            
            createBoard();
            updateUI();
            
            // Reset camera
            camera.position.set(0, boardSize * 1.5, boardSize * 1.2);
            controls.target.set(0, 0, 0);
        }
        
        function onDifficultyChange() {
            startNewGame();
        }
        
        function onMouseClick(event) {
            if (gameOver) return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cellObjects);
            
            if (intersects.length > 0) {
                const cell = intersects[0].object;
                const data = cell.userData;
                
                if (!gameStarted) {
                    gameStarted = true;
                    startTime = Date.now();
                    placeMines(data.x, data.z);
                    calculateNeighbors();
                    startTimer();
                }
                
                if (!data.flagged) {
                    revealCell(data.x, data.z);
                }
            }
        }
        
        function onRightClick(event) {
            event.preventDefault();
            if (gameOver) return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cellObjects);
            
            if (intersects.length > 0) {
                const cell = intersects[0].object;
                toggleFlag(cell);
            }
        }
        
        let hoveredCell = null;
        function onMouseMove(event) {
            if (gameOver) return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cellObjects);
            
            if (intersects.length > 0) {
                const cell = intersects[0].object;
                if (hoveredCell !== cell && !cell.userData.revealed) {
                    if (hoveredCell) {
                        hoveredCell.material.color.setHex(hoveredCell.userData.isLight ? COLORS.boardLight : COLORS.board);
                    }
                    hoveredCell = cell;
                    hoveredCell.material.color.setHex(COLORS.cellHover);
                }
            } else {
                if (hoveredCell) {
                    hoveredCell.material.color.setHex(hoveredCell.userData.isLight ? COLORS.boardLight : COLORS.board);
                    hoveredCell = null;
                }
            }
        }
        
        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${minutes}:${seconds}`;
            }, 1000);
        }
        
        function updateUI() {
            document.getElementById('mine-count').textContent = mineCount;
            document.getElementById('flag-count').textContent = flagsPlaced;
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Initialize
        init();
    </script>
</body>
</html>
